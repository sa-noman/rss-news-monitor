# Cloudflare Worker configuration
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Secrets are NOT stored here. Create them once with:
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   npx wrangler secret put ADMIN_TOKEN

name = "news-monitor-worker"
main = "src/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true

# Monitoring schedule.
#
# The free Workers plan allows only ~10 ms CPU per invocation, which is not
# enough to parse all 18 feeds in one go. The worker therefore rotates the feed
# list: slot = floor(UTC minute / 1) % 30, and this cron ticks every minute.
# Each tick handles exactly one feed, so every source is still polled every
# 30 minutes while a single invocation pays the CPU cost of one feed.
#
# Want one single run every 30 minutes instead? Set FEED_SHARDS = "1" and use
# crons = ["*/30 * * * *"]. That works on the Workers Paid plan (30 s CPU);
# on the free plan a single 18-feed run exceeds the 10 ms CPU limit and is
# terminated with Error 1102.
[triggers]
crons = ["* * * * *"]

# Non-secret configuration only
[vars]
ITEMS_PER_FEED = "25"
FEED_SHARDS = "30"
FEED_SHARD_INTERVAL_MINUTES = "1"
OG_IMAGE_SCRAPE = "true"

# Structured logs are visible in Workers Logs / `npx wrangler tail`
[observability]
enabled = true

# Local development: `npx wrangler dev` reads secrets from .dev.vars
# (create worker/.dev.vars locally — it is gitignored)

